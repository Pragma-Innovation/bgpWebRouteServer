# ==============================================================================
# Gabu — Core Service Topology (Shared Base)
#   • Developer & Lab stack: make dev-up   (layers docker-compose.dev.yml)
#   • Production stack:      make prod-up  (layers docker-compose.prod.yml)
# ==============================================================================

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: bgpweb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bgpweb}
      POSTGRES_USER: ${POSTGRES_USER:-bgpuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bgppassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bgpuser} -d ${POSTGRES_DB:-bgpweb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bgpnet

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: bgpweb-backend
    restart: unless-stopped
    volumes:
      - gobgp_config:/configs
      - django_static:/staticfiles
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-please-change-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-bgpuser}:${POSTGRES_PASSWORD:-bgppassword}@db:5432/${POSTGRES_DB:-bgpweb}
      BGP_ENGINE_BACKEND: ${BGP_ENGINE_BACKEND:-apps.bgp_engine.backends.gobgp.GoBgpBackend}
      BGP_MOCK_MODE: ${BGP_MOCK_MODE:-False}
      GOBGP_GRPC_HOST: ${GOBGP_GRPC_HOST:-gobgp}
      GOBGP_GRPC_PORT: ${GOBGP_GRPC_PORT:-50051}
      GOBGP_CONFIG_PATH: /configs/gobgp.yaml
      BGP_LOCAL_AS: ${BGP_LOCAL_AS:-65000}
      BGP_ROUTER_ID: ${BGP_ROUTER_ID:-10.100.0.10}
      BGP_LISTEN_PORT: ${BGP_LISTEN_PORT:-179}
      AUTO_SEED_ROUTING: ${AUTO_SEED_ROUTING:-True}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@gabu.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/live/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - bgpnet

  gobgp:
    image: docker.io/osrg/gobgp:latest
    container_name: bgpweb-gobgp
    restart: unless-stopped
    entrypoint: ["gobgpd", "-f", "/etc/gobgp/gobgp.yaml", "-t", "yaml", "--api-hosts", ":50051"]
    volumes:
      - gobgp_config:/etc/gobgp:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      bgpnet: {}

  peer-syncer:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: bgpweb-peer-syncer
    restart: unless-stopped
    command: python manage.py run_peer_syncer --interval ${PEER_SYNC_INTERVAL:-10}
    volumes:
      - gobgp_config:/configs
    environment:
      SKIP_DB_INIT: "True"
      COLLECT_STATIC: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-please-change-in-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-bgpuser}:${POSTGRES_PASSWORD:-bgppassword}@db:5432/${POSTGRES_DB:-bgpweb}
      BGP_ENGINE_BACKEND: ${BGP_ENGINE_BACKEND:-apps.bgp_engine.backends.gobgp.GoBgpBackend}
      BGP_MOCK_MODE: ${BGP_MOCK_MODE:-False}
      GOBGP_GRPC_HOST: ${GOBGP_GRPC_HOST:-gobgp}
      GOBGP_GRPC_PORT: ${GOBGP_GRPC_PORT:-50051}
      GOBGP_CONFIG_PATH: /configs/gobgp.yaml
    depends_on:
      backend:
        condition: service_healthy
      gobgp:
        condition: service_started
    networks:
      - bgpnet

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: bgpweb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bgpnet

volumes:
  pgdata:
    driver: local
  gobgp_config:
    driver: local
  django_static:
    driver: local

networks:
  bgpnet:
    driver: bridge
