/*
 * BIRD 3 Router Configuration for eBGP Flowspec & RTBH Lab Peering
 * Local AS: 65001, Router ID: 10.100.0.20
 * Peer: GoBGP (AS 65000, 10.100.0.10)
 */

log stderr all;
router id 10.100.0.20;

protocol device {
}

/* Dedicated Unicast and Flowspec Routing Tables */
ipv4 table t_unicast4;
ipv6 table t_unicast6;
flow4 table t_flow4;
flow6 table t_flow6;

/* RTBH Import Policy: routes tagged with (65535, 666) RFC 7999 BLACKHOLE are converted to blackholes */
filter rtbh_import {
    if (65535, 666) ~ bgp_community then {
        dest = RTD_BLACKHOLE;
        accept;
    }
    accept;
}

/* eBGP Peering Session with GoBGP Controller */
protocol bgp gobgp_peer {
    description "eBGP peering with GoBGP Flowspec & RTBH Controller";
    local as 65001;
    neighbor 10.100.0.10 as 65000;

    connect delay time 2;
    connect retry time 5;
    error wait time 5, 30;

    ipv4 {
        table t_unicast4;
        gateway recursive;
        import filter rtbh_import;
        export none;
    };

    ipv6 {
        table t_unicast6;
        gateway recursive;
        import filter rtbh_import;
        export none;
    };

    flow4 {
        table t_flow4;
        import all;
        export none;
    };

    flow6 {
        table t_flow6;
        import all;
        export none;
    };
}
