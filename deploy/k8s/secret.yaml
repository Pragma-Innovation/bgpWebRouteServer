apiVersion: v1
kind: Secret
metadata:
  name: bgpweb-secrets
  namespace: bgpweb
  labels:
    app.kubernetes.io/name: bgpweb
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "django-insecure-k8s-prod-bgpweb-key-change-me-in-vault-or-sealedsecrets"
  DATABASE_URL: "postgres://bgpuser:bgpsecret@postgres:5432/bgpweb"
  POSTGRES_DB: "bgpweb"
  POSTGRES_USER: "bgpuser"
  POSTGRES_PASSWORD: "bgpsecret"
