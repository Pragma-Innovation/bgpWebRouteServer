apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bgpweb
  labels:
    app.kubernetes.io/name: bgpweb
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bgpweb
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bgpweb
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: run-migrations
          image: bgpweb-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: bgpweb-config
            - secretRef:
                name: bgpweb-secrets
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: bgpweb-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args:
            - "config.wsgi:application"
            - "--bind"
            - "0.0.0.0:8000"
            - "--workers"
            - "3"
            - "--access-logfile"
            - "-"
            - "--error-logfile"
            - "-"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bgpweb-config
            - secretRef:
                name: bgpweb-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/live/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
