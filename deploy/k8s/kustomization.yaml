apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bgpweb

labels:
  - pairs:
      app.kubernetes.io/name: bgpweb
      app.kubernetes.io/part-of: bgpWebRouteServer

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres-statefulset.yaml
  - gobgp-daemon.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - services.yaml
  - ingress.yaml
