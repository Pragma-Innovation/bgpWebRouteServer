apiVersion: v1
kind: ConfigMap
metadata:
  name: bgpweb-config
  namespace: bgpweb
  labels:
    app.kubernetes.io/name: bgpweb
    app.kubernetes.io/component: config
data:
  # Django Backend Configuration
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,frontend,bgpweb.local,*"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:8080,http://bgpweb.local"
  
  # BGP Engine Backend Settings
  BGP_ENGINE_BACKEND: "apps.bgp_engine.backends.gobgp.GoBgpBackend"
  BGP_MOCK_MODE: "False"
  GOBGP_GRPC_HOST: "gobgp"
  GOBGP_GRPC_PORT: "50051"
  GOBGP_TIMEOUT_SECONDS: "10"

  # GoBGP Daemon Configuration (mounted into /etc/gobgp/gobgp.yaml)
  gobgp.yaml: |
    global:
      config:
        as: 65001
        router-id: 10.0.0.1
        port: 179
        listen-addresses:
          - "0.0.0.0"
    neighbors:
      - config:
          neighbor-address: 10.0.0.2
          peer-as: 65002
        afi-safis:
          - config:
              afi-safi-name: ipv4-flowspec
          - config:
              afi-safi-name: ipv6-flowspec
